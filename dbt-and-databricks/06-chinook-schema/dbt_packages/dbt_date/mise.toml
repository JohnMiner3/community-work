[tools]
python = "3.11.11"

[tasks.setup]
description = "Install dependencies and start docker compose integration test containers"
run = [
    "uv sync",
    "docker compose -f ./integration_tests/docker-compose.yml up -d",
]

[tasks.teardown]
description = "Stop docker compose integration test containers"
run = "docker compose -f ./integration_tests/docker-compose.yml down"

[tasks."test:bigquery"]
description = "Run integration tests for BigQuery"
dir = "integration_tests"
run = [
    "dbt debug --target bigquery",
    "dbt deps",
    "dbt build --target bigquery --full-refresh",
]

[tasks."test:clickhouse"]
description = "Run integration tests for ClickHouse"
dir = "integration_tests"
run = [
    "dbt debug --target clickhouse",
    "dbt deps",
    "dbt run --target clickhouse",
    "dbt test --target clickhouse",
]

