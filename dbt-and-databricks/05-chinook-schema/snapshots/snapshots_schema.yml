version: 2

snapshots:

#
# Album - Slowly Changing Dimension (SCD) 
#

- name: Album02
  description: Snapshot of album data
  columns:
    - name: AlbumId
      quoted: true
      description: Unique identifier for the album
      data_type: int
      
    - name: Title
      quoted: true
      description: Title of the album
      data_type: varchar(93)
      
    - name: ArtistId
      quoted: true
      description: Artist identifier
      data_type: int
      
    - name: dbt_scd_id
      
      description: dbt SCD unique identifier
      data_type: varchar(32)
      
    - name: dbt_updated_at
      quoted: true
      description: Timestamp when the record was updated
      data_type: datetime2(6)
      
    - name: dbt_valid_from
      quoted: true
      description: Start of validity period for this record
      data_type: datetime2(6)
      
    - name: dbt_valid_to
      quoted: true
      description: End of validity period for this record
      data_type: datetime2(6)

