seeds:

  #
  # Seed data for Album
  #

  - name: Album
    config:
      alias: Album01
    description: "Raw album data"
    columns:
      - name: AlbumId
        quote: true
        description: "Album identifier"
        data_type: int
        data_tests:
          - not_null
          - unique

      - name: Title
        quote: true
        description: "Album title"
        data_type: varchar(93)

      - name: ArtistId
        quote: true
        description: "Artist identifier"
        data_type: int
        data_tests:
          - relationships:
              arguments:
                to: ref('Artist')
                field: '"ArtistId"'

  #
  # Seed data for Artist
  #

  - name: Artist
    config:
      alias: Artist01
