
#
#  Project configuration file
#

name: 'chinook'
version: '1.0.0'

# This setting indicates which profile dbt should use
profile: 'chinook'


#
#  Use quoting for mixed case identifiers and reserved words
#

quoting:
  database: true
  schema: true
  identifier: true


#
#  Define paths
#

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]


#
#  Directories to clean  
#

clean-targets:    
  - "target"
  - "dbt_packages"


#
#  Configure seeds
#

seeds:
  chinook:
    schema: raw 


#
#  Configure snapshots
#

snapshots:
  chinook:
    schema: snapshot 

#
#  Configure models
#

models:
  chinook:

    stage: 
      +schema: stage
      +materialized: table
      
    mart: 
      +schema: mart
      +materialized: table    

